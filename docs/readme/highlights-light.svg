<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-label="Highlights. STEALTH: Looks like a real website. VLESS + Reality: a probe sees a genuine certificate, never a VPN. CLOSED: Default-deny firewall. nftables, LAN-only key SSH, fail2ban, panel behind nginx. DYNAMIC IP: Follows your changing IP. casavpn-ddns fixes your DNS record every minute and alerts. BACKUPS: Backups you have restored. Nightly age-encrypted archive and a restore drill that proves it. UPGRADES: Upgrades that roll back. 3x-ui pinned by SHA-256; backup first, automatic rollback. ALERTS: You hear first. Healthcheck, external monitor and push alerts to your phone.">
