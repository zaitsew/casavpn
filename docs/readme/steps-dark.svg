<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" role="img" aria-label="How it works. 1. Dry run. Creates casavpn.env, then stops. 2. Configure. Domain, LAN range, Cloudflare token, age key. 3. Install. One script sets up every layer. 4. Add clients. Create the Reality inbound in the panel. 5. Forward ports. 443 and 8443 only; test on mobile data.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ECEDF2}.m{fill:#A2A7B5}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="187" rx="12" fill="#171A21" stroke="#2B2F3A"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#4AA3FA"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Dry run</text>
<text class="m" x="40.0" y="120" font-size="13.5">Creates casavpn.env,</text>
<text class="m" x="40.0" y="139" font-size="13.5">then stops.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#4AA3FA"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">Configure</text>
<text class="m" x="200.0" y="120" font-size="13.5">Domain, LAN range,</text>
<text class="m" x="200.0" y="139" font-size="13.5">Cloudflare token, age</text>
<text class="m" x="200.0" y="158" font-size="13.5">key.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#4AA3FA"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Install</text>
<text class="m" x="360.0" y="120" font-size="13.5">One script sets up</text>
<text class="m" x="360.0" y="139" font-size="13.5">every layer.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#2B2F3A" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#4AA3FA"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Add clients</text>
<text class="m" x="520.0" y="120" font-size="13.5">Create the Reality</text>
<text class="m" x="520.0" y="139" font-size="13.5">inbound in the panel.</text>
<circle cx="700.0" cy="52" r="20" fill="#4AA3FA"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Forward ports</text>
<text class="m" x="680.0" y="120" font-size="13.5">443 and 8443 only;</text>
<text class="m" x="680.0" y="139" font-size="13.5">test on mobile data.</text>
</svg>
