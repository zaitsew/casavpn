# /etc/nginx/conf.d/00-casavpn.conf: http-context settings the CasaVPN vhost needs.

# Without this map the panel's live statistics fail with
# "Failed to upgrade WebSocket connection".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Subscription endpoint: a client refreshes it a few times a day. Anything
# faster is a scanner or a loop.
limit_req_zone $binary_remote_addr zone=casavpn_sub:1m rate=30r/m;
