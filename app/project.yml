name: CasaVPN
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CasaKit:
    path: CasaKit

targets:
  CasaVPN:
    type: application
    platform: iOS
    sources:
      - path: CasaVPN
    dependencies:
      - package: CasaKit
    settings:
      base:
        INFOPLIST_FILE: CasaVPN/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: CasaVPN/Supporting/CasaVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # XcodeGen's iOS target default is "1,2" and beats a project-level "1":
        # an iPad-capable portrait-only build is refused at upload.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  CasaVPN:
    build:
      targets:
        CasaVPN: all
    run:
      config: Debug
    archive:
      config: Release
